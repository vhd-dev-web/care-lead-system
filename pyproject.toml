[project]
name = "vhd-lead-system"
version = "0.1.0"
description = "Central master-first lead system for VHD lead workflows."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
]

[project.scripts]
vhd-enrich = "lead_enrichment.cli:main"
vhd-lead-scrape = "vhd_lead_system.scraper.woocommerce_lead_finder:main"
vhd-lead-setup = "vhd_lead_system.setup_wizard:main"
vhd-lead-verify = "vhd_lead_system.scraper.lead_qualifier:main"
vhd-lead-system = "vhd_lead_system.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
